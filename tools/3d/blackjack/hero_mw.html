<!doctype html><html><body style="margin:0"><script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three'; import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js'; import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {createKit} from './shared/model-kit.js'; import {wheel,flapper,stage} from './mw.js'; import {drawFace,drawBack,cardMesh,CW,CH} from './cards.js'; import {chipMesh,CHIPS} from './chips.js'; import {L} from './shared/layout.js';
const q=new URLSearchParams(location.search); const W=+q.get('w')||1200,H=+q.get('h')||900;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); r.setSize(W,H); r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=0.85; r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap; document.body.appendChild(r.domElement);
const s=new THREE.Scene(); s.background=new THREE.Color(0x120d18); s.environment=new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(),0.04).texture; s.environmentIntensity=0.6;
const floor=new THREE.Mesh(new THREE.PlaneGeometry(10,10),new THREE.MeshStandardMaterial({color:0x6b5040,roughness:0.85})); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; s.add(floor);
const spot=new THREE.SpotLight(0xfff0d8,11,6,0.85,0.7,1.5); spot.position.set(0.2,2.6,0.45); spot.target.position.set(0,0.8,0.35); spot.castShadow=true; spot.shadow.mapSize.set(2048,2048); spot.shadow.bias=-0.0002; s.add(spot,spot.target);
const kit=await createKit(THREE); const MW=L.mw;
s.add(await stage(THREE,kit));
const wh=wheel(THREE,kit); wh.position.set(...MW.wheel); wh.rotation.z=+(q.get('rot')||0); s.add(wh);
const fl=flapper(THREE,kit); fl.position.set(...MW.flapper); fl.rotation.z=+(q.get('flap')||0); s.add(fl);
const chipModels=CHIPS.map(ch=>chipMesh(THREE,kit,ch));
const stack=(i,n,x,z)=>{for(let k=0;k<n;k++){const m=chipModels[i].clone(); m.position.set(x+Math.sin(k*2.1)*0.001,MW.desk.y+k*L.chipH,z); m.rotation.y=k*0.7; s.add(m)}};
stack(1,3,MW.spots[0],MW.spotZ); stack(2,2,MW.spots[3],MW.spotZ); stack(0,1,MW.spots[5],MW.spotZ);
const g=await new GLTFLoader().loadAsync('host.glb'); const d=g.scene; d.position.set(...MW.host); d.rotation.y=MW.hostYaw*Math.PI/180; d.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true}}); s.add(d);
if(q.get('hide')) d.traverse(n=>{if(n.isMesh){const ms=Array.isArray(n.material)?n.material:[n.material]; ms.forEach(m=>{if(m.name.includes(q.get('hide'))) m.visible=false})}});
const mixer=new THREE.AnimationMixer(d); const clip=g.animations.find(c=>c.name===(q.get('clip')||'Idle')); if(clip){mixer.clipAction(clip).play(); mixer.setTime(+q.get('t')||0.6);}
let morph; d.traverse(n=>{if(n.morphTargetDictionary)morph=n}); for(const kv of (q.get('m')||'AK_44_MouthSmileLeft:0.5,AK_45_MouthSmileRight:0.5').split(',').filter(Boolean)){const [k,v]=kv.split(':'); if(morph&&morph.morphTargetDictionary[k]!==undefined) morph.morphTargetInfluences[morph.morphTargetDictionary[k]]=+v;}
const v=(q.get('cam')||[L.mw.seatEye.join(','),'0.1,1.2,0.0'].join(',')).split(',').map(Number);
const cam=new THREE.PerspectiveCamera(+q.get('fov')||55,W/H,0.01,50); cam.position.set(v[0],v[1],v[2]); cam.lookAt(v[3],v[4],v[5]);
r.render(s,cam); window.DONE=1;
</script></body></html>
