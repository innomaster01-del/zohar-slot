<!doctype html><html><body style="margin:0"><script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three'; import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js'; import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {createKit} from './shared/model-kit.js'; import {build,rotor,ball,dolly} from './roulette.js'; import {drawFace,drawBack,cardMesh,CW,CH} from './cards.js'; import {chipMesh,CHIPS} from './chips.js'; import {L} from './shared/layout.js';
const q=new URLSearchParams(location.search); const W=+q.get('w')||1200,H=+q.get('h')||900;
const r=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true}); r.setSize(W,H); r.toneMapping=THREE.ACESFilmicToneMapping; r.toneMappingExposure=0.85; r.shadowMap.enabled=true; r.shadowMap.type=THREE.PCFSoftShadowMap; document.body.appendChild(r.domElement);
const s=new THREE.Scene(); s.background=new THREE.Color(0x1d1a1a); s.environment=new THREE.PMREMGenerator(r).fromScene(new RoomEnvironment(),0.04).texture; s.environmentIntensity=0.6;
const floor=new THREE.Mesh(new THREE.PlaneGeometry(10,10),new THREE.MeshStandardMaterial({color:0x6b5040,roughness:0.85})); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; s.add(floor);
const spot=new THREE.SpotLight(0xfff0d8,11,6,0.85,0.7,1.5); spot.position.set(0.2,2.6,0.45); spot.target.position.set(0,0.8,0.35); spot.castShadow=true; spot.shadow.mapSize.set(2048,2048); spot.shadow.bias=-0.0002; s.add(spot,spot.target);
const kit=await createKit(THREE); const table=await build(THREE,kit); s.add(table);
const R=L.roul, G=R.grid;
const rot=rotor(THREE,kit); rot.position.set(...R.wheel); rot.rotation.y=+q.get('rot')||0.3; s.add(rot);
const pk=+(q.get('pocket')||7); const step=Math.PI*2/37; const a=-pk*step+rot.rotation.y;
const bl=ball(THREE,kit); bl.position.set(R.wheel[0]+Math.sin(a)*R.pocketR, R.wheel[1]+R.pocketY, R.wheel[2]+Math.cos(a)*R.pocketR); s.add(bl);
const chipModels=CHIPS.map(ch=>chipMesh(THREE,kit,ch));
const stack=(i,n,x,z,jit=0.0012)=>{for(let k=0;k<n;k++){const m=chipModels[i].clone(); m.position.set(x+Math.sin(k*2.1)*jit,L.feltY+k*L.chipH,z+Math.cos(k*1.7)*jit); m.rotation.y=k*0.7; s.add(m)}};
const cx=(u)=>G.gx0+u*G.cw, cz=(v)=>G.gz0+v*G.ch;
stack(1,2,cx(5.5),cz(1.5)); stack(0,1,cx(3),cz(2)); stack(2,1,cx(9),cz(1.5)); stack(1,3,cx(5),G.gz0+3*G.ch+G.dh+G.eh/2); stack(0,2,cx(12.5),cz(0.5));
const dl=dolly(THREE,kit); dl.position.set(cx(8.5),L.feltY,cz(1.5)); s.add(dl);
// dealer
const g=await new GLTFLoader().loadAsync('dealer.glb'); const d=g.scene; d.position.set(R.dealer[0],0,R.dealer[1]); d.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true}}); s.add(d);
const mixer=new THREE.AnimationMixer(d); const clip=g.animations.find(c=>c.name===(q.get('clip')||'Idle')); mixer.clipAction(clip).play(); mixer.setTime(+q.get('t')||0.6);
let morph; d.traverse(n=>{if(n.morphTargetDictionary)morph=n}); for(const kv of (q.get('m')||'AK_44_MouthSmileLeft:0.45,AK_45_MouthSmileRight:0.45').split(',').filter(Boolean)){const [k,v]=kv.split(':'); morph.morphTargetInfluences[morph.morphTargetDictionary[k]]=+v;}
const v=(q.get('cam')||[L.roul.seatEye.join(','),'-0.3,0.88,0.45'].join(',')).split(',').map(Number);
const cam=new THREE.PerspectiveCamera(+q.get('fov')||55,W/H,0.01,50); cam.position.set(v[0],v[1],v[2]); cam.lookAt(v[3],v[4],v[5]);
r.render(s,cam); window.DONE=1;
</script></body></html>
