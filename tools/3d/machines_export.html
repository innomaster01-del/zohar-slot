<!doctype html><html><head><meta charset="utf-8"></head><body><script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three'; import {GLTFExporter} from 'three/addons/exporters/GLTFExporter.js';
import {createKit} from './shared/model-kit.js'; import {pharaohCabinet,dragonCabinet} from './machines.js';
const ex=new GLTFExporter(); const b64=(buf)=>{let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const kit=await createKit(THREE); await document.fonts.load('900 60px "Noto Serif CJK SC"','龍福發');
const out={}, info={};
for(const [name,fn] of [['pharaoh',pharaohCabinet],['dragon',dragonCabinet]]){
  const g=fn(THREE,kit);
  g.traverse(o=>{if(o.material&&o.material.map&&!o.name.startsWith('Label_')&&o.name!=='FloorGlow')o.material.map.userData.mimeType='image/jpeg'});
  out[`models/${name}_cabinet.glb`]=b64(await ex.parseAsync(g,{binary:true,maxTextureSize:2048}));
  const n=[]; g.traverse(o=>{if(o.isMesh)n.push(o.name)}); info[name]=n;
}
window.OUT=out; window.INFO=Object.fromEntries(Object.entries(out).map(([k,v])=>[k,Math.round(v.length*0.75/1024)+'KB'])); window.NAMES=info; window.DONE=1;
</script></body></html>
