name: Build APK
on: { push: { branches: ['**'] }, workflow_dispatch: {} }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties && gradle :app:assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk zohar-slot.apk
      - uses: actions/upload-artifact@v4
        with: { name: zohar-slot-apk, path: zohar-slot.apk }
