name: Build APK
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: echo "sdk.dir=$ANDROID_HOME" > local.properties && gradle :app:assembleRelease --no-daemon
      - run: cp app/build/outputs/apk/release/app-release.apk zohar-slot.apk
      - uses: actions/upload-artifact@v4
        with: { name: zohar-slot-apk, path: zohar-slot.apk }
      # Publish: a GitHub Release (download straight to the phone) + an "apk" branch holding the file
      - name: Release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG="v1.0-build${{ github.run_number }}"
          gh release create "$TAG" zohar-slot.apk --title "ZOHAR $TAG" --notes "מכונת מזל ZOHAR לאנדרואיד · כסף משחק בלבד. להתקנה: הורד את zohar-slot.apk בטלפון ופתח אותו." --latest
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout --orphan apk && git rm -rqf . && cp zohar-slot.apk apk.bin && mv apk.bin zohar-slot.apk && git add zohar-slot.apk
          git commit -qm "APK build ${{ github.run_number }}" && git push -f origin apk
