name: Build APK
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.8.1' }
      - name: Hand-tracking model (MediaPipe, Apache-2.0)
        run: |
          mkdir -p app/src/main/assets/mediapipe
          curl -fsSL -o app/src/main/assets/mediapipe/hand_landmarker.task https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task
          ls -la app/src/main/assets/mediapipe
      - name: Unit tests + APK
        id: build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Publish build log (success or failure)
        if: always()
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          mkdir -p /tmp/logs; cp build.log /tmp/logs/ 2>/dev/null || echo "no log" > /tmp/logs/build.log
          find app/build/test-results -name '*.xml' -exec cp {} /tmp/logs/ \; 2>/dev/null || true
          cp app/build/outputs/apk/release/app-release.apk /tmp/logs/zohar-ar.apk 2>/dev/null || true
          git checkout --orphan build-output && git rm -rqf . && cp /tmp/logs/* . && git add -A && git commit -qm "build ${{ github.run_number }}: ${{ steps.build.outcome }}" && git push -f origin build-output
      - name: Release
        if: steps.build.outcome == 'success'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "ar-v2-build${{ github.run_number }}" /tmp/logs/zohar-ar.apk --title "ZOHAR AR build ${{ github.run_number }}" --notes "ZOHAR AR (ARCore) · כסף משחק בלבד" --latest
