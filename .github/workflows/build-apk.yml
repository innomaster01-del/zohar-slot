name: Build APK
on:
  push: { branches: [main] }
  workflow_dispatch:
    inputs:
      emulator: { description: 'Also run the emulator self-tests (adds about 18 minutes)', type: boolean, default: false }
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.8.1' }
      - name: Hand-tracking model (MediaPipe, Apache-2.0)
        run: |
          mkdir -p app/src/main/assets/mediapipe
          curl -fsSL -o app/src/main/assets/mediapipe/hand_landmarker.task https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task
      - name: Unit tests + APKs
        id: build
        env: { MAPBOX_TOKEN: '${{ secrets.MAPBOX_TOKEN }}', GOOGLE_AR_KEY: '${{ secrets.GOOGLE_AR_KEY }}' }
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          gradle :app:testSlotDebugUnitTest :app:assembleRelease $([ "${{ inputs.emulator }}" = "true" ] && echo :app:assembleDebug) --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Enable KVM
        if: steps.build.outcome == 'success' && inputs.emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Smoke test on the ARCore emulator (virtual scene)
        id: smoke
        if: steps.build.outcome == 'success' && inputs.emulator
        continue-on-error: true
        timeout-minutes: 18
        uses: reactivecircus/android-emulator-runner@v2
        env: { GH_TOKEN: '${{ github.token }}' }
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -camera-back virtualscene -no-snapshot -noaudio -no-boot-anim
          script: bash tools/smoke.sh
      - name: Publish build output (log, tests, smoke screenshots, APK)
        if: always()
        run: |
          OUT=$(mktemp -d); cp build.log $OUT/ 2>/dev/null || echo "no log" > $OUT/build.log
          find app/build/test-results -name '*.xml' -exec cp {} $OUT/ \; 2>/dev/null || true
          cp -r smoke $OUT/ 2>/dev/null || true
          cp app/build/outputs/apk/slot/release/app-slot-release.apk $OUT/zohar-slot.apk 2>/dev/null || true; cp app/build/outputs/apk/scratch/release/app-scratch-release.apk $OUT/zohar-scratch.apk 2>/dev/null || true; cp app/build/outputs/apk/blackjack/release/app-blackjack-release.apk $OUT/zohar-blackjack.apk 2>/dev/null || true; cp app/build/outputs/apk/holdem/release/app-holdem-release.apk $OUT/zohar-holdem.apk 2>/dev/null || true; cp app/build/outputs/apk/baccarat/release/app-baccarat-release.apk $OUT/zohar-baccarat.apk 2>/dev/null || true; cp app/build/outputs/apk/roulette/release/app-roulette-release.apk $OUT/zohar-roulette.apk 2>/dev/null || true; cp app/build/outputs/apk/moneywheel/release/app-moneywheel-release.apk $OUT/zohar-moneywheel.apk 2>/dev/null || true; cp app/build/outputs/apk/walk/release/app-walk-release.apk $OUT/zohar-walk.apk 2>/dev/null || true; cp app/build/outputs/apk/hilo/release/app-hilo-release.apk $OUT/zohar-hilo.apk 2>/dev/null || true; cp app/build/outputs/apk/craps/release/app-craps-release.apk $OUT/zohar-craps.apk 2>/dev/null || true; cp app/build/outputs/apk/plinko/release/app-plinko-release.apk $OUT/zohar-plinko.apk 2>/dev/null || true; cp app/build/outputs/apk/bonus/release/app-bonus-release.apk $OUT/zohar-bonus.apk 2>/dev/null || true
          cd $OUT && git init -q && git checkout -q -b build-output && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "build ${{ github.run_number }}: ${{ steps.build.outcome }} smoke=${{ steps.smoke.outcome }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-output
      - name: Release
        if: steps.build.outcome == 'success'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "ar-v2-build${{ github.run_number }}" app/build/outputs/apk/slot/release/app-slot-release.apk#ZOHAR-Slot-AR.apk app/build/outputs/apk/scratch/release/app-scratch-release.apk#ZOHAR-Scratch-AR.apk app/build/outputs/apk/blackjack/release/app-blackjack-release.apk#ZOHAR-Blackjack-AR.apk app/build/outputs/apk/holdem/release/app-holdem-release.apk#ZOHAR-Holdem-AR.apk app/build/outputs/apk/baccarat/release/app-baccarat-release.apk#ZOHAR-Baccarat-AR.apk app/build/outputs/apk/roulette/release/app-roulette-release.apk#ZOHAR-Roulette-AR.apk app/build/outputs/apk/moneywheel/release/app-moneywheel-release.apk#ZOHAR-MoneyWheel-AR.apk app/build/outputs/apk/walk/release/app-walk-release.apk#ZOHAR-Walk-AR.apk app/build/outputs/apk/hilo/release/app-hilo-release.apk#ZOHAR-HiLo-AR.apk app/build/outputs/apk/craps/release/app-craps-release.apk#ZOHAR-Craps-AR.apk app/build/outputs/apk/plinko/release/app-plinko-release.apk#ZOHAR-Plinko-AR.apk app/build/outputs/apk/bonus/release/app-bonus-release.apk#ZOHAR-Bonus-AR.apk --title "ZOHAR Slot + Scratch + Blackjack + Hold'em + Baccarat + Roulette + Money Wheel + Walk + Hi-Lo + Craps + Plinko + Bonus build ${{ github.run_number }}" --notes "ZOHAR AR (ARCore) · כסף משחק בלבד" --latest
