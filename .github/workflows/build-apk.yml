name: Build APK
on: { push: { branches: [main] }, workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.8.1' }
      - name: Hand-tracking model (MediaPipe, Apache-2.0)
        run: |
          mkdir -p app/src/main/assets/mediapipe
          curl -fsSL -o app/src/main/assets/mediapipe/hand_landmarker.task https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task
      - name: Unit tests + APKs
        id: build
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          gradle :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Enable KVM
        if: steps.build.outcome == 'success'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Smoke test on the ARCore emulator (virtual scene)
        id: smoke
        if: steps.build.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 18
        uses: reactivecircus/android-emulator-runner@v2
        env: { GH_TOKEN: '${{ github.token }}' }
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -camera-back virtualscene -no-snapshot -noaudio -no-boot-anim
          script: bash tools/smoke.sh
      - name: Publish build output (log, tests, smoke screenshots, APK)
        if: always()
        run: |
          OUT=$(mktemp -d); cp build.log $OUT/ 2>/dev/null || echo "no log" > $OUT/build.log
          find app/build/test-results -name '*.xml' -exec cp {} $OUT/ \; 2>/dev/null || true
          cp -r smoke $OUT/ 2>/dev/null || true
          cp app/build/outputs/apk/release/app-release.apk $OUT/zohar-ar.apk 2>/dev/null || true
          cd $OUT && git init -q && git checkout -q -b build-output && git add -A
          git -c user.name=github-actions -c user.email=github-actions@users.noreply.github.com commit -qm "build ${{ github.run_number }}: ${{ steps.build.outcome }} smoke=${{ steps.smoke.outcome }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" build-output
      - name: Release
        if: steps.build.outcome == 'success'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "ar-v2-build${{ github.run_number }}" app/build/outputs/apk/release/app-release.apk#zohar-ar.apk --title "ZOHAR AR build ${{ github.run_number }}" --notes "ZOHAR AR (ARCore) · כסף משחק בלבד" --latest
