<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZOHAR Slot AR</title>
<!--
  webxr-ar-core template — surface placement AR (Android Chrome / Quest) + 3D preview fallback.
  Edit only the sections marked "EDIT". Keep three + addons on the SAME pinned version.
-->
<style>
  /* `hidden` must win over any display rule below (e.g. .bar a { display: inline-flex }) */
  [hidden] { display: none !important; }
  :root {
    --ui-bg: rgba(18, 20, 28, 0.78);
    --ui-fg: #f4f5f8;
    --ui-muted: #b8bcc8;
    --accent: #ffb000;
    --accent-fg: #1b1300;
    --preview-bg: #20232d;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; overflow: hidden; background: var(--preview-bg); color: var(--ui-fg);
    font: 16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* The overlay is also the WebXR dom-overlay root, so it must stay transparent. */
  #overlay { position: fixed; inset: 0; pointer-events: none; display: flex; flex-direction: column; justify-content: space-between;
    padding: calc(12px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); }
  #overlay > * { pointer-events: auto; }
  #status { align-self: center; max-width: 34rem; background: var(--ui-bg); color: var(--ui-fg); border-radius: 12px;
    padding: 10px 14px; text-align: center; font-size: 15px; }
  #status:empty { display: none; }
  .bar { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: auto; }
  .bar button { min-height: 48px; min-width: 48px; padding: 0 20px; border: 0; border-radius: 999px; font: inherit; font-weight: 600;
    background: var(--ui-bg); color: var(--ui-fg); cursor: pointer; }
  .bar button.primary { background: var(--accent); color: var(--accent-fg); }
  .bar a { display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; border-radius: 999px; font-weight: 600;
    background: var(--accent); color: var(--accent-fg); text-decoration: none; }
  .bar a:focus-visible { outline: 3px solid var(--ui-fg); outline-offset: 2px; }
  .bar.game { margin-top: 8px; }
  .bar button.spin { min-width: 120px; font-size: 18px; background: #18c95a; color: #031a0b; }
  .bar button[aria-pressed="true"] { outline: 2px solid var(--accent); }
  .note { margin: 8px 0 0; text-align: center; font-size: 12px; color: var(--ui-muted); text-shadow: 0 1px 2px #000; }
  .bar button:focus-visible { outline: 3px solid var(--ui-fg); outline-offset: 2px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "./vendor/three/build/three.module.js",
    "three/addons/": "./vendor/three/addons/"
  }
}
</script>
</head>
<body>
<div id="overlay">
  <div id="status" role="status" aria-live="polite"></div>
  <div class="bar" id="bar">
    <button id="startAR" class="primary" hidden>הצג בחדר שלך (AR)</button>
    <button id="moveBtn" hidden>הזז</button>
    <button id="exitAR" hidden>יציאה מ-AR</button>
    <a id="iosView" hidden>תצוגה בחדר (Quick Look)</a>
    <a id="iosPlay" hidden>שחק במצב מצלמה</a>
  </div>
  <div class="bar game" id="game" hidden>
    <button id="betDown" aria-label="הורד הימור">−</button>
    <button id="spinBtn" class="primary spin">סובב</button>
    <button id="betUp" aria-label="העלה הימור">+</button>
    <button id="autoBtn">אוטומטי</button>
    <button id="sizeBtn">גודל שולחן</button>
    <button id="muteBtn" aria-label="השתק">🔊</button>
  </div>
  <p class="note">כסף משחק בלבד · אין הימור אמיתי, אין קנייה ואין משיכה</p>
</div>

<script>
  // Watchdog: if the 3D module never starts (CDN blocked, weak network, old browser, script error),
  // say so instead of leaving a blank screen. The module sets window.__arApp when it is running.
  setTimeout(function () {
    if (window.__arApp) return;
    var s = document.getElementById('status');
    if (s) { s.textContent = 'הטעינה נכשלה. בדוק את החיבור לאינטרנט ורענן את הדף.'; s.hidden = false; s.style.display = 'block'; }
    document.documentElement.dataset.bootFailed = '1';
  }, 10000);
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { createKit } from './model-kit.js';
import { createVideoSlot } from './video-slot.js';
// import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';   // EDIT: uncomment to load a .glb

/* ===================== EDIT: configuration ===================== */
const CONFIG = {
  modelHeightMeters: 2.06,     // real cabinet height (life size); the size button switches to tabletop
  tabletopMeters: 0.62,
  maxFloorTilt: 0.8,           // hit normal.y must exceed this → only floors/tables, not walls
  allowMove: true,
  // iPhone has no WebXR: buttons to the ar-ios-quicklook pages, e.g. { view: 'view.html', play: 'play.html' }
  iosLinks: { view: 'view.html', play: 'play.html' },
};
const TEXT = {
  insecure: 'AR דורש HTTPS. פתח את הדף בכתובת https://',
  noXR: 'הדפדפן הזה לא תומך ב-AR מבוסס WebXR. אפשר לסובב את הדגם עם האצבע.',
  ios: 'באייפון WebXR לא נתמך. השתמש בגרסת Quick Look (model-viewer + USDZ).',
  unsupported: 'המכשיר הזה לא תומך ב-AR. אפשר לסובב את הדגם עם האצבע.',
  blocked: 'הגישה ל-AR נחסמה (למשל בתוך iframe). פתח את הדף ישירות.',
  failed: 'לא הצלחנו להפעיל AR. בדוק הרשאת מצלמה ונסה שוב.',
  scan: 'הזז את הטלפון לאט לאורך הרצפה או השולחן',
  tap: 'הקש על המסך כדי להציב',
  placed: '',
};
/* ===================== EDIT: your content ===================== */
const kit = await createKit(THREE);
const slot = createVideoSlot(THREE, kit, { onState: syncUi });
function buildModel() { return slot.root; }
const app = {
  onModelTap: (hit) => slot.handleTap(hit),
  onFrame: (dt) => slot.update(dt),
};
// on-screen controls (big targets — the cabinet buttons are small when you stand back)
const $ = (id) => document.getElementById(id);
document.getElementById('game').hidden = false;
document.getElementById('game').addEventListener('beforexrselect', (e) => e.preventDefault());
const tap = (id, fn) => $(id).addEventListener('click', (e) => { e.stopPropagation(); slot.sounds.unlock(); fn(); });
tap('spinBtn', () => slot.spin());
tap('betDown', () => { slot.bet(-1); slot.cabinet.press('BetDownButton'); });
tap('betUp', () => { slot.bet(+1); slot.cabinet.press('BetUpButton'); });
tap('autoBtn', () => { slot.toggleAuto(); slot.cabinet.press('AutoButton'); });
tap('muteBtn', () => { slot.sounds.muted = !slot.sounds.muted; $('muteBtn').textContent = slot.sounds.muted ? '🔇' : '🔊'; });
let tabletop = false;
tap('sizeBtn', () => { tabletop = !tabletop; model.scale.setScalar(1); model.position.set(0, 0, 0); fitToHeight(model, tabletop ? CONFIG.tabletopMeters : CONFIG.modelHeightMeters); $('sizeBtn').textContent = tabletop ? 'גודל אמיתי' : 'גודל שולחן'; });
function syncUi(st) {
  if (!st) return;
  $('autoBtn').setAttribute('aria-pressed', st.auto > 0 ? 'true' : 'false');
  $('betDown').disabled = $('betUp').disabled = st.busy || st.inFree;
  $('spinBtn').textContent = st.busy ? 'עצור' : st.inFree ? `חינם (${st.freeLeft})` : 'סובב';
}
setInterval(() => syncUi(slot.state()), 250);
window.__slot = slot;
/* ================================================================ */

const overlay = document.getElementById('overlay');
const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startAR');
const moveBtn = document.getElementById('moveBtn');
const exitBtn = document.getElementById('exitAR');
const setStatus = (t) => { statusEl.textContent = t || ''; };

// UI taps inside dom-overlay must NOT also fire an XR 'select' (would place/tap the model).
document.getElementById('bar').addEventListener('beforexrselect', (e) => e.preventDefault());

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = true;
renderer.xr.enabled = true;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const previewBg = new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--preview-bg').trim() || '#20232d');
scene.background = previewBg;

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.01, 50);
{ // frame the preview camera to the model's real size (a 1.8 m machine and a 10 cm toy both fit)
  const h = CONFIG.modelHeightMeters;
  camera.position.set(h * 0.9, h * 0.75, h * 2.6);
  camera.far = Math.max(50, h * 20); camera.updateProjectionMatrix();
}

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
{ const h = CONFIG.modelHeightMeters; sun.position.set(0.6 * h, 2.2 * h, 1.3 * h); }
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
{ const e = CONFIG.modelHeightMeters * 1.2; // shadow area follows the model's size
  Object.assign(sun.shadow.camera, { left: -e, right: e, top: e, bottom: -e, near: 0.01, far: CONFIG.modelHeightMeters * 6 }); }
scene.add(sun);

// Everything that gets placed lives under `anchor` (origin = floor point under the model).
const anchor = new THREE.Group();
scene.add(anchor);
sun.target = anchor;

let model = null;
function fitToHeight(obj, h) {
  const box = new THREE.Box3().setFromObject(obj);
  const size = box.getSize(new THREE.Vector3());
  if (size.y > 0) obj.scale.multiplyScalar(h / size.y);
  box.setFromObject(obj);
  const c = box.getCenter(new THREE.Vector3());
  obj.position.x -= c.x; obj.position.z -= c.z; obj.position.y -= box.min.y; // sit on the floor
}
async function setModel(obj) {
  if (model) anchor.remove(model);
  model = await obj;
  fitToHeight(model, CONFIG.modelHeightMeters);
  anchor.add(model);
}
await setModel(buildModel());

// Soft contact shadow so the object looks grounded on the real floor.
const shadowCatcher = new THREE.Mesh(new THREE.PlaneGeometry(Math.max(3, CONFIG.modelHeightMeters * 3), Math.max(3, CONFIG.modelHeightMeters * 3)), new THREE.ShadowMaterial({ opacity: 0.3 }));
shadowCatcher.rotation.x = -Math.PI / 2;
shadowCatcher.receiveShadow = true;
anchor.add(shadowCatcher);

const reticle = new THREE.Mesh(new THREE.RingGeometry(0.07, 0.09, 40).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0xffffff }));
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, CONFIG.modelHeightMeters / 2, 0);
controls.enableDamping = true;
controls.minDistance = CONFIG.modelHeightMeters * 0.6;
controls.maxDistance = CONFIG.modelHeightMeters * 8;
controls.update();

// ---------- AR support detection (never assume; always fall back to the 3D preview) ----------
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
async function detectAR() {
  if (!window.isSecureContext) return 'insecure';
  if (!('xr' in navigator)) return isIOS ? 'ios' : 'noXR';
  try { return (await navigator.xr.isSessionSupported('immersive-ar')) ? 'ok' : (isIOS ? 'ios' : 'unsupported'); }
  catch { return 'blocked'; }
}
const support = await detectAR();
if (support === 'ok') startBtn.hidden = false; else setStatus(TEXT[support]);
if (support === 'ios' && CONFIG.iosLinks) {
  for (const [id, key] of [['iosView', 'view'], ['iosPlay', 'play']]) {
    const a = document.getElementById(id);
    if (CONFIG.iosLinks[key]) { a.href = CONFIG.iosLinks[key]; a.hidden = false; }
  }
  setStatus('');
}
document.documentElement.dataset.arSupport = support; // handy for tests

// ---------- AR session ----------
let mode = 'preview'; // 'preview' | 'placing' | 'placed'
let hitTestSource = null;
let session = null;

startBtn.addEventListener('click', async () => {
  // requestSession must be called directly from the click (user activation), before any other await.
  try {
    session = await navigator.xr.requestSession('immersive-ar', {
      requiredFeatures: ['hit-test'],
      optionalFeatures: ['dom-overlay'],
      domOverlay: { root: overlay },
    });
  } catch (e) { console.warn('requestSession failed', e); setStatus(TEXT.failed); return; }
  try {
    session.addEventListener('end', onSessionEnd);
    renderer.xr.setReferenceSpaceType('local');
    await renderer.xr.setSession(session);
    const viewerSpace = await session.requestReferenceSpace('viewer');
    hitTestSource = await session.requestHitTestSource({ space: viewerSpace });
    session.addEventListener('select', onSelect);
    scene.background = null;            // show the camera feed
    controls.enabled = false;
    startBtn.hidden = true; exitBtn.hidden = false;
    enterPlacing();
  } catch (e) {
    // A half-started session leaves a black screen; end it so the page returns to the 3D preview.
    console.warn('AR setup failed', e);
    await session?.end().catch(() => {});
    setStatus(TEXT.failed);
  }
});
exitBtn.addEventListener('click', () => session?.end());
moveBtn.addEventListener('click', enterPlacing);

function enterPlacing() {
  mode = 'placing';
  anchor.visible = false;
  moveBtn.hidden = true;
  setStatus(TEXT.scan);
}

const tmpRay = new THREE.Raycaster();
function onSelect(event) {
  if (mode === 'placing') {
    if (!reticle.visible) return;
    anchor.position.setFromMatrixPosition(reticle.matrix);
    // Turn the model's front (+Z) toward the viewer, rotating only around Y.
    const camPos = new THREE.Vector3().setFromMatrixPosition(renderer.xr.getCamera().matrixWorld);
    anchor.rotation.set(0, Math.atan2(camPos.x - anchor.position.x, camPos.z - anchor.position.z), 0);
    anchor.visible = true;
    reticle.visible = false;
    mode = 'placed';
    moveBtn.hidden = !CONFIG.allowMove;
    setStatus(TEXT.placed);
    return;
  }
  if (mode === 'placed' && app.onModelTap) {
    // Ray from the tap (screen input source) into the scene.
    const pose = event.frame.getPose(event.inputSource.targetRaySpace, renderer.xr.getReferenceSpace());
    if (!pose) return;
    const m = new THREE.Matrix4().fromArray(pose.transform.matrix);
    const origin = new THREE.Vector3().setFromMatrixPosition(m);
    const dir = new THREE.Vector3(0, 0, -1).transformDirection(m);
    tmpRay.set(origin, dir);
    const hit = tmpRay.intersectObject(model, true)[0];
    if (hit) app.onModelTap(hit);
  }
}

function onSessionEnd() {
  hitTestSource?.cancel?.();
  hitTestSource = null; session = null;
  mode = 'preview';
  anchor.position.set(0, 0, 0); anchor.rotation.set(0, 0, 0); anchor.visible = true;
  reticle.visible = false;
  scene.background = previewBg;
  controls.enabled = true;
  startBtn.hidden = false; exitBtn.hidden = true; moveBtn.hidden = true;
  setStatus('');
  onResize();
}

// Preview mode: taps on the model also call onModelTap.
const pointer = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', (e) => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', (e) => {
  if (renderer.xr.isPresenting || !downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return; // a drag, not a tap
  pointer.set((e.clientX / window.innerWidth) * 2 - 1, -(e.clientY / window.innerHeight) * 2 + 1);
  tmpRay.setFromCamera(pointer, camera);
  const hit = tmpRay.intersectObject(model, true)[0];
  if (hit) app.onModelTap?.(hit);
});

// ---------- loop ----------
const timer = new THREE.Timer(); // THREE.Clock is deprecated since r18x
timer.connect(document);          // pauses delta while the tab is hidden
renderer.setAnimationLoop((time, frame) => {
  timer.update(time);
  const dt = Math.min(timer.getDelta(), 0.1);
  if (frame && hitTestSource && mode === 'placing') {
    const hits = frame.getHitTestResults(hitTestSource);
    const ref = renderer.xr.getReferenceSpace();
    let found = false;
    for (const h of hits) {
      const pose = h.getPose(ref);
      if (!pose) continue;
      const m = pose.transform.matrix;           // column-major; Y axis of the hit pose = surface normal
      if (m[5] < CONFIG.maxFloorTilt) continue;  // skip walls / steep surfaces
      reticle.matrix.fromArray(m);
      found = true; break;
    }
    reticle.visible = found;
    setStatus(found ? TEXT.tap : TEXT.scan);
  }
  if (!renderer.xr.isPresenting) controls.update();
  app.onFrame?.(dt);
  renderer.render(scene, camera);
});

function onResize() {
  if (renderer.xr.isPresenting) return; // XR owns the size while presenting
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);

window.__arApp = { THREE, scene, anchor, camera, renderer, app, setModel, get mode() { return mode; } }; // debug/test handle
</script>
</body>
</html>
