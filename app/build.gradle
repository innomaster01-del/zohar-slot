plugins { id 'com.android.application' }
android {
    namespace 'com.zohar.slotar'
    compileSdk 34
    defaultConfig {
        applicationId 'com.zohar.slotar'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }   // installable without a store key (sideload)
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
